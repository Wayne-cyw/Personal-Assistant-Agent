[project]
name = "personal-agent"
version = "0.1.0"
description = "Backend-only conversational AI agent: owner Q&A via RAG, calendar booking, layered refusals."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "aiosqlite",
  "asyncpg",
  "httpx",
  "numpy",
  "openai",
  "tiktoken",
  "google-api-python-client",
  "google-auth",
  "google-auth-oauthlib",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. are designed to be called in argument
# defaults; B008 otherwise flags every dependency-injected route handler.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is prose, not code; wrapping it at 100 chars mid-sentence
# would hurt readability for no benefit (line length is irrelevant to the
# model consuming it as one string).
"app/agent/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
