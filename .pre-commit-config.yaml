repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: forbid-secrets-and-db-files
        name: forbid committing .env or database files
        entry: bash -c 'git diff --cached --name-only | grep -E "(^|/)\.env($|\.[^e])|\.(db|sqlite3?|db-journal)$" && echo "Refusing to commit secrets/DB files" && exit 1 || exit 0'
        language: system
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, pydantic-settings]
        files: ^app/
